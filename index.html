<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>pi · pigui</title>
		<style>
			/* 极简占位样式：只保证可用与可读，正式外观请自行替换 */
			:root {
				--bg: #fbfbfa;
				--panel: #ffffff;
				--line: #e4e4e1;
				--text: #1f2328;
				--muted: #6b7280;
				--accent: #2563eb;
				--user: #eef2ff;
				--assistant: #ffffff;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				flex-direction: column;
				background: var(--bg);
				color: var(--text);
				font: 14px/1.55 system-ui, "Segoe UI", sans-serif;
			}
			header {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 8px 14px;
				border-bottom: 1px solid var(--line);
				background: var(--panel);
			}
			header .title {
				font-weight: 600;
				white-space: nowrap;
			}
			header .meta {
				color: var(--muted);
				font-size: 12px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				flex: 1;
			}
			header button,
			footer button {
				border: 1px solid var(--line);
				background: var(--panel);
				color: var(--text);
				border-radius: 6px;
				padding: 5px 10px;
				cursor: pointer;
			}
			header button:hover,
			footer button:hover {
				border-color: var(--accent);
				color: var(--accent);
			}
			main {
				flex: 1;
				overflow-y: auto;
				padding: 14px;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.msg {
				max-width: 860px;
				padding: 9px 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.msg.user {
				background: var(--user);
				align-self: flex-end;
			}
			.msg.assistant {
				background: var(--assistant);
			}
			.msg.other {
				background: #f6f6f4;
				color: var(--muted);
				font-size: 12px;
			}
			.status {
				color: var(--muted);
				font-size: 12px;
				font-style: italic;
			}
			.thinking {
				color: var(--muted);
				font-size: 12px;
				border-left: 2px solid var(--line);
				padding-left: 8px;
				white-space: pre-wrap;
			}
			.block-text {
				white-space: pre-wrap;
			}
			.tool-call {
				font-family: ui-monospace, "Cascadia Mono", monospace;
				font-size: 12px;
				background: #f6f6f4;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 6px 8px;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.tool-result {
				font-size: 12px;
			}
			.tool-result summary {
				cursor: pointer;
				color: var(--muted);
			}
			.tool-result pre {
				margin: 6px 0 0;
				padding: 8px;
				background: #f6f6f4;
				border: 1px solid var(--line);
				border-radius: 6px;
				overflow-x: auto;
				white-space: pre-wrap;
			}
			footer {
				display: flex;
				gap: 8px;
				padding: 10px 14px;
				border-top: 1px solid var(--line);
				background: var(--panel);
			}
			textarea {
				flex: 1;
				resize: none;
				height: 64px;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				font: inherit;
				color: inherit;
				background: var(--bg);
			}
			textarea:focus {
				outline: 1px solid var(--accent);
			}
		</style>
	</head>
	<body>
		<header>
			<span class="title">pigui</span>
			<span class="meta" id="meta">正在连接…</span>
			<button id="abort" title="中止当前回合">中止</button>
			<button id="new" title="开始一个新会话">新建会话</button>
		</header>
		<main id="messages"></main>
		<footer>
			<textarea id="input" placeholder="输入消息 — Enter 发送，Shift+Enter 换行"></textarea>
			<button id="send">发送</button>
		</footer>

		<script>
			const messagesEl = document.getElementById('messages');
			const metaEl = document.getElementById('meta');
			const inputEl = document.getElementById('input');
			const sendEl = document.getElementById('send');

			/** 页面上正在流式输出的气泡，null 表示当前没有输出。 */
			let streamingEl = null;
			/** 页面上正在流式输出的思考气泡。 */
			let thinkingEl = null;

			/** 是否已经贴到底部（用于决定要不要自动滚动）。 */
			function pinnedToBottom() {
				return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;
			}

			/** 追加一个元素，并在需要时滚到底。 */
			function append(node) {
				const pinned = pinnedToBottom();
				messagesEl.appendChild(node);
				if (pinned) messagesEl.scrollTop = messagesEl.scrollHeight;
			}

			/** 清空所有气泡（新建会话时用）。 */
			function clearMessages() {
				messagesEl.replaceChildren();
				streamingEl = null;
				thinkingEl = null;
			}

			/** 添加一条消息气泡。 */
			function addMessage(role, text) {
				const cls = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'other';
				const node = document.createElement('div');
				node.className = 'msg ' + cls;
				node.textContent = text;
				append(node);
				return node;
			}

			/** 渲染一个内容块（服务端已按类型拆好）。 */
			function addBlock(container, block) {
				const type = block.type || 'other';
				if (type === 'thinking') {
					const node = document.createElement('div');
					node.className = 'thinking';
					node.textContent = block.text || '';
					container.appendChild(node);
					return;
				}
				if (type === 'toolCall') {
					const node = document.createElement('div');
					node.className = 'tool-call';
					const body = block.arguments || block.text || '';
					node.textContent = '⚙ ' + (block.name || 'tool') + (body ? '\n' + body : '');
					container.appendChild(node);
					return;
				}
				if (type === 'toolResult') {
					const details = document.createElement('details');
					details.className = 'tool-result';
					const summary = document.createElement('summary');
					summary.textContent = '工具输出';
					const pre = document.createElement('pre');
					pre.textContent = block.text || '';
					details.append(summary, pre);
					container.appendChild(details);
					return;
				}
				if (type === 'text') {
					const node = document.createElement('div');
					node.className = 'block-text';
					node.textContent = block.text || '';
					container.appendChild(node);
					return;
				}
				if (block.text) {
					const node = document.createElement('div');
					node.className = 'status';
					node.textContent = '[' + type + '] ' + block.text;
					container.appendChild(node);
				}
			}

			/** 按块渲染一条消息气泡（existing 传入时复用已有气泡，用于流式结束后重绘）。 */
			function addMessageBlocks(role, blocks, existing) {
				const cls = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'other';
				const node = existing || document.createElement('div');
				if (existing) node.replaceChildren();
				else {
					node.className = 'msg ' + cls;
					append(node);
				}
				for (const block of blocks || []) addBlock(node, block);
				return node;
			}

			/** 添加一条状态行（工具事件、错误等）。 */
			function addStatus(text) {
				const node = document.createElement('div');
				node.className = 'status';
				node.textContent = text;
				append(node);
			}

			/** 更新头部信息。 */
			function renderContext(context) {
				if (!context) return;
				const parts = [context.cwd];
				if (context.model) parts.push(context.model);
				if (context.sessionFile) parts.push(context.sessionFile.split(/[\\/]/).pop());
				parts.push(context.busy ? '运行中' : '空闲');
				metaEl.textContent = parts.join(' · ');
				metaEl.title = context.sessionFile || context.cwd;
			}

			/** 处理服务端推来的事件帧。 */
			function handleFrame(frame) {
				if (frame.kind === 'history') {
					clearMessages();
					for (const message of frame.messages || []) {
						if (Array.isArray(message.blocks) && message.blocks.length > 0) addMessageBlocks(message.role, message.blocks);
						else if (message.text) addMessage(message.role, message.text);
					}
					return;
				}
				if (frame.kind === 'session') {
					renderContext(frame.info);
					if (frame.info && frame.info.modelFallbackMessage) addStatus('提示：' + frame.info.modelFallbackMessage);
					return;
				}
				if (frame.kind === 'delta') {
					thinkingEl = null;
					if (!streamingEl) streamingEl = addMessage('assistant', '');
					streamingEl.textContent += frame.text;
					if (pinnedToBottom()) messagesEl.scrollTop = messagesEl.scrollHeight;
					return;
				}
				if (frame.kind === 'thinking') {
					if (!thinkingEl) {
						thinkingEl = document.createElement('div');
						thinkingEl.className = 'thinking';
						append(thinkingEl);
					}
					thinkingEl.textContent += frame.text;
					return;
				}
				if (frame.kind === 'message') {
					const message = frame.message || {};
					const blocks = Array.isArray(message.blocks) ? message.blocks : [];
					const role = message.role || 'unknown';
					const target = role === 'assistant' ? streamingEl : null;
					if (blocks.length > 0) {
						addMessageBlocks(role, blocks, target);
						if (target) streamingEl = null;
					} else if (message.text) {
						if (target) {
							target.textContent = message.text;
							streamingEl = null;
						} else {
							addMessage(role, message.text);
						}
					}
					thinkingEl = null;
					return;
				}
				if (frame.kind === 'event') {
					if (frame.type === 'agent_end' || frame.type === 'agent_settled') streamingEl = null;
					const detail = frame.detail && Object.keys(frame.detail).length ? ' ' + JSON.stringify(frame.detail) : '';
					addStatus('· ' + frame.type + detail);
					return;
				}
				if (frame.kind === 'error') {
					addStatus('错误：' + frame.message);
				}
			}

			/** 建立 SSE 连接（断线后浏览器会自动重连）。 */
			function connect() {
				const source = new EventSource('/api/events');
				source.onmessage = (event) => {
					try {
						handleFrame(JSON.parse(event.data));
					} catch {
						/* 忽略无法解析的帧 */
					}
				};
				source.onerror = () => renderContext({ cwd: '连接中断，正在重试…' });
				return source;
			}

			/** 发送一条消息（运行中时服务端会自动改为 steer）。 */
			async function send() {
				const text = inputEl.value.trim();
				if (!text) return;
				inputEl.value = '';
				addMessage('user', text);
				await fetch('/api/prompt', {
					method: 'POST',
					headers: { 'content-type': 'application/json' },
					body: JSON.stringify({ message: text }),
				}).catch(() => addStatus('发送失败'));
			}

			sendEl.addEventListener('click', () => void send());
			inputEl.addEventListener('keydown', (event) => {
				if (event.key === 'Enter' && !event.shiftKey) {
					event.preventDefault();
					void send();
				}
			});
			document.getElementById('abort').addEventListener('click', () => {
				void fetch('/api/abort', { method: 'POST' });
			});
			document.getElementById('new').addEventListener('click', async () => {
				await fetch('/api/new', { method: 'POST' }).catch(() => {});
				clearMessages();
				addStatus('已开始新会话');
			});

			fetch('/api/context')
				.then((response) => response.json())
				.then((data) => renderContext(data.context))
				.catch(() => {});
			connect();
		</script>
	</body>
</html>
